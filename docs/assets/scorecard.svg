<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-labelledby="title desc">
<title id="title">twoseat scorecard</title>
<desc id="desc">twoseat benchmark scorecard: Precision 97.4%, Recall 100.0%, F1 98.7%, Median cost per review $0.0092. 47 of 48 synthetic cases scored. Single run per case, no sampling controls. Synthetic diffs are cleaner than real ones, so every figure is an upper bound. Method: bench/README.md. Report: bench/results/REPORT.md. As of 2026-09-03.</desc>
<rect x="0.5" y="0.5" width="639" height="219" rx="8" fill="#f0f2f4" stroke="#8b949e"/>
<text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">twoseat scorecard</text>
<text x="616" y="36" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#57606a">claude-sonnet-5, prompt version 3</text>
<text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Precision</text>
<text x="24" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#1f2328">97.4%</text>
<text x="172" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Recall</text>
<text x="172" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#1f2328">100.0%</text>
<text x="320" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">F1</text>
<text x="320" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#1f2328">98.7%</text>
<text x="468" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Median cost per review</text>
<text x="468" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#1f2328">$0.0092</text>
<line x1="24" y1="140" x2="616" y2="140" stroke="#d0d7de"/>
<text x="24" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">47 of 48 synthetic cases scored. Single run per case, no sampling controls.</text>
