name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "!node_modules/**"
      - name: dist matches source
        run: |
          npm run build
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- dist
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
