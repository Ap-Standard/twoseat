name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # A source file git reads as binary gets no patch from the pull request
      # files API, so this gate can never review it. Keep it its own step: the
      # failure it prevents is invisible to every other check here.
      - name: source files are reviewable
        run: npm run check:text
      # Regenerating the README scorecard needs no key and no paid run: it
      # reads the committed result of the last one. A README whose numbers
      # drifted from the report they summarize is a figure with no method.
      - name: readme scorecard matches the last benchmark run
        run: npm run scorecard:check
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "!node_modules/**"
      - name: dist matches source
        run: |
          npm run build
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- dist
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned so the scanner here matches the one a change is verified
          # against locally. Left unpinned, CI picked 8.24.3 while local was
          # 8.30.1, and an allowlist form that works in the newer version is
          # silently ignored by the older one. See .gitleaks.toml.
          GITLEAKS_VERSION: 8.30.1
